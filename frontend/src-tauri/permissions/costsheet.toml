[[permission]]
identifier = "allow-get-device-info"
description = "Allow reading the local device ID for license activation."
commands.allow = ["get_device_info"]

[[permission]]
identifier = "allow-check-costsheet-activation"
description = "Allow checking this device's Cost Sheet activation status."
commands.allow = ["check_costsheet_activation"]

[[permission]]
identifier = "allow-activate-costsheet"
description = "Allow activating a Cost Sheet license on this device."
commands.allow = ["activate_costsheet"]

[[permission]]
identifier = "allow-desktop-activation-check"
description = "Allow the Cost Sheet WebView to verify this computer's activation."
commands.allow = ["get_device_info", "check_costsheet_activation"]
