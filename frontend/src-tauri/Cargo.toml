[package]
name = "costsheet"
version = "1.0.0"
description = "Cost Sheet desktop client"
authors = ["SmorX"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "costsheet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2.12"
tauri = { version = "2.12.4", features = [] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
